services:
  - type: web
    name: jlf
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        value: jlf_super_secret_key_change_in_production_2024
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://jlf.onrender.com
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: SPREADSHEET_ID
        sync: false